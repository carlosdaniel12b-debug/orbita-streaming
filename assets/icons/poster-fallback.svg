<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140f2b"/>
      <stop offset="50%" stop-color="#0a0815"/>
      <stop offset="100%" stop-color="#050409"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#d946ef" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orbitRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="500" height="750" fill="url(#bg)"/>
  <circle cx="250" cy="340" r="180" fill="url(#glow)"/>
  <ellipse cx="250" cy="340" rx="140" ry="60" fill="none" stroke="url(#orbitRing)" stroke-width="3" opacity="0.8" transform="rotate(-20 250 340)"/>
  <ellipse cx="250" cy="340" rx="190" ry="85" fill="none" stroke="#d946ef" stroke-width="1.5" opacity="0.4" stroke-dasharray="6,6" transform="rotate(-20 250 340)"/>
  <circle cx="250" cy="340" r="42" fill="#0d091e" stroke="#c084fc" stroke-width="3"/>
  <circle cx="250" cy="340" r="20" fill="#ffffff" opacity="0.95"/>
  <!-- Satélite -->
  <circle cx="360" cy="300" r="8" fill="#f59e0b"/>
  <!-- Texto Marca -->
  <text x="250" y="470" text-anchor="middle" fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="22" font-weight="800" letter-spacing="4">ÓRBITA</text>
  <text x="250" y="500" text-anchor="middle" fill="#c084fc" font-family="'Space Grotesk', monospace" font-size="12" font-weight="600" letter-spacing="6">STREAMING 4K</text>
  <rect x="180" y="530" width="140" height="28" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
  <text x="250" y="549" text-anchor="middle" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="11" font-weight="600">CINEMA ESTRENO</text>
</svg>
